name: Offline tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt 'pytest>=9,<10'
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --include=optional --no-audit --no-fund
      - name: Python tests without provider connections or workers
        run: python scripts/run_offline_tests.py
      - name: Node tests without provider connections
        run: node --import ./scripts/offline_node_guard.mjs --test tests/*.test.mjs
